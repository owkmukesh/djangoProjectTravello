<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h2>Create an Account</h2>
    
    <!-- The form element processes the input data -->
    <form action="register" method="POST">
        {% csrf_token %}
        <!-- Full Name Field -->
        <div>
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" placeholder="John Doe" required>
        </div>
        <br>

        <div>
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" placeholder="John Doe" required>
        </div>
        <br>

        <div>
            <label for="username">UserName:</label>
            <input type="text" id="username" name="username" placeholder="John Doe" required>
        </div>
        <br>

        <!-- Email Field -->
        <div>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>
        <br>

        <!-- Password Field -->
        <div>
            <label for="password1">Password:</label>
            <input type="password" id="password1" name="password1" minlength="8" required>
        </div>
        <br>
        <div>
            <label for="password2">Confirm Password:</label>
            <input type="password" id="password2" name="password2" minlength="8" required>
        </div>
        <br>
        <!-- Submit Button -->
        <div>
            <button type="submit">Register</button>
        </div>

    </form>
    {% for message in messages %}
        <div>
            {{message}}
        </div>
    {% endfor %}
</body>
</html>
